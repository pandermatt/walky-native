<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    A door: what the tool marks a wall as, rather than a block it drops of its
    own. Kept to the plainest shape a door has, a panel and a handle, since a
    floor-plan swing reads as a door only at a size larger than a toolbar icon
    ever is.
  -->
  <rect x="24" y="10" width="46" height="80" rx="5" fill="none" stroke="#000" stroke-width="8"/>
  <circle cx="58" cy="52" r="5.5" fill="#000"/>
</svg>
